apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-backend
  namespace: weathergpt
  labels:
    app: weathergpt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weathergpt-backend
  template:
    metadata:
      labels:
        app: weathergpt-backend
    spec:
      serviceAccountName: weathergpt
      containers:
        - name: backend
          image: ghcr.io/sih-smart-attendance-team/sih-main-round:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          env:
            # Database URLs — reference service names of the k8s Services above
            - name: POSTGRES_URL
              value: "postgresql+asyncpg://weathergpt:$(POSTGRES_PASSWORD)@weathergpt-postgres:5432/weathergpt"
            - name: MONGO_URL
              value: "mongodb://weathergpt:$(MONGO_PASSWORD)@weathergpt-mongo:27017/weathergpt?authSource=admin"
            - name: TIMESCALE_URL
              value: "postgresql+asyncpg://weathergpt:$(TIMESCALE_PASSWORD)@weathergpt-timescaledb:5432/weathergpt_ts"
          volumeMounts:
            - name: media-storage
              mountPath: /tmp/weathergpt_media
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: media-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-backend
  namespace: weathergpt
  labels:
    app: weathergpt-backend
spec:
  selector:
    app: weathergpt-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weathergpt-backend-hpa
  namespace: weathergpt
spec:
# Scale on both CPU and memory to handle traffic spikes
# (the original tech-stack doc calls for auto-scaling on traffic surges)
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weathergpt-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
---
# Generic Ingress — works with any ingress controller (nginx-ingress, traefik, etc.)
# No cloud-provider-specific LB annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weathergpt-ingress
  namespace: weathergpt
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - weathergpt.example.com
      secretName: weathergpt-tls
  rules:
    - host: weathergpt.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weathergpt-backend
                port:
                  number: 80
