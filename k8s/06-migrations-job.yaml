apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrations
  namespace: weathergpt
  labels:
    app: alembic-migrations
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: alembic-migrations
        app.kubernetes.io/name: weathergpt
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do sleep 2; done
              echo "PostgreSQL ready."
      containers:
        - name: migrations
          image: ghcr.io/sih-smart-attendance-team/sih-main-round:latest
          imagePullPolicy: Always
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"