apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-mongo
  namespace: weathergpt
  labels:
    app: weathergpt-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weathergpt-mongo
  template:
    metadata:
      labels:
        app: weathergpt-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          env:
            - name: MONGO_INITDB_DATABASE
              value: "weathergpt"
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "weathergpt"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weathergpt-secrets
                  key: MONGO_PASSWORD
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')", "-u", "weathergpt", "--authenticationDatabase", "admin"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')", "-u", "weathergpt", "--authenticationDatabase", "admin"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: weathergpt-mongo-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weathergpt-mongo-pvc
  namespace: weathergpt
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-mongo
  namespace: weathergpt
  labels:
    app: weathergpt-mongo
spec:
  selector:
    app: weathergpt-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  type: ClusterIP
