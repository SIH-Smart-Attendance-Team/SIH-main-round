# Kubernetes Secrets for WeatherGPT
# All sensitive credentials live here; non-sensitive config lives in 01-configmap.yaml.
# Populate values before applying:
#   kubectl create secret generic weathergpt-secrets \
#     --from-literal=POSTGRES_PASSWORD=changeme \
#     --from-literal=MONGO_PASSWORD=changeme \
#     --from-literal=TIMESCALE_PASSWORD=changeme \
#     --from-literal=JWT_SECRET=changeme \
#     --from-literal=GOOGLE_API_KEY=... \
#     --from-literal=TWILIO_ACCOUNT_SID=... \
#     --from-literal=TWILIO_AUTH_TOKEN=... \
#     -n weathergpt
#
# Out of scope (no telco / government access available):
#   - Cell Broadcast (CBAS) — requires telco infrastructure integration
#   - VHF / CSC broadcast — requires radio hardware and licensing
# These cannot be faked with a free API and are intentionally not included
# in any k8s manifest or dispatcher channel.
---
apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  MONGO_PASSWORD: change-me
  TIMESCALE_PASSWORD: change-me
  JWT_SECRET: change-me-in-production

  # LLM API keys
  GOOGLE_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""

  # Twilio credentials (shared by WhatsApp, Voice, and SMS channels)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_NUMBER: ""
  TWILIO_SMS_NUMBER: ""
  TWILIO_WHATSAPP_NUMBER: ""

  # WhatsApp (Meta Cloud API)
  WHATSAPP_VERIFY_TOKEN: ""
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_PHONE_NUMBER_ID: ""
  AGENT_NOTIFY_WEBHOOK_URL: ""

  # Bhashini API (Indian language STT/TTS)
  BHASHINI_USER_ID: ""
  BHASHINI_API_KEY: ""

  # StormGlass marine data
  STORMGLASS_API_KEY: ""
