apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  # PostgreSQL / PostGIS
  POSTGRES_PASSWORD: "change-me-in-production"
  POSTGRES_USER: "weathergpt"
  POSTGRES_DB: "weathergpt"

  # TimescaleDB
  TIMESCALE_PASSWORD: "change-me-in-production"
  TIMESCALE_USER: "weathergpt"
  TIMESCALE_DB: "weathergpt_ts"

  # MongoDB
  MONGO_PASSWORD: "change-me-in-production"
  MONGO_USER: "weathergpt"
  MONGO_DB: "weathergpt"

  # JWT
  JWT_SECRET: "change-me-in-production-use-strong-random"

  # Google / Gemini API
  GOOGLE_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""

  # Twilio (Voice + SMS)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_SMS_NUMBER: ""
  TWILIO_NUMBER: ""
  TWILIO_WHATSAPP_NUMBER: ""

  # Meta WhatsApp Cloud API
  WHATSAPP_VERIFY_TOKEN: ""
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_PHONE_NUMBER_ID: ""

  # Bhashini (Translation/STT/TTS)
  BHASHINI_USER_ID: ""
  BHASHINI_API_KEY: ""
  BHASHINI_PIPELINE_ID: ""

  # Stormglass (Marine data)
  STORMGLASS_API_KEY: ""

  # Agent notification webhook (for escalation handoff)
  AGENT_NOTIFY_WEBHOOK_URL: ""

  # Webhook secret for broadcast endpoint
  WEBHOOK_SECRET: ""

  # CBAS / VHF / CSC (stubs - require telco infrastructure)
  CBAS_API_ENDPOINT: ""
  CBAS_API_KEY: ""
  VHF_CSC_ENDPOINT: ""
  VHF_CSC_API_KEY: ""